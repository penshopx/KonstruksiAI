kind = "mobile"
previewPath = "/konstruksi-ai-mobile/"
title = "KonstruksiAI Mobile"
version = "1.0.0"
id = "artifacts/konstruksi-ai-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/konstruksi-ai-mobile/" ]
localPort = 18148

[services.development]
run = "pnpm --filter @workspace/konstruksi-ai-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/konstruksi-ai-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/konstruksi-ai-mobile", "run", "serve" ]

[services.env]
PORT = "18148"
BASE_PATH = "/konstruksi-ai-mobile/"
