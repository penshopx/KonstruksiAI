openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /tender-intelligence/requests/active:
    get:
      operationId: discoverActiveTenderRequest
      summary: Discover only the current account's active request in an authorized scope
      parameters:
        - in: query
          name: workspaceId
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Read-only execution reference or null; excludes completed history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderActiveRequest"
        "400": { description: Invalid workspace }
        "401": { description: Authentication required }
        "403": { description: Workspace access revoked }
        "404": { description: Workspace absent }
  /tender-intelligence/requests/executions/{executionId}:
    get:
      operationId: recoverTenderExecution
      summary: Read a discovered execution without dispatching AI
      parameters:
        - in: path
          name: executionId
          required: true
          schema: { type: string, pattern: "^[a-zA-Z0-9_-]{16,128}$" }
        - in: query
          name: workspaceId
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Authoritative completed result for the discovered execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderRequestState"
        "202":
          description: Execution is still running; never restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderRequestState"
        "400": { description: Invalid reference or workspace }
        "401": { description: Authentication required }
        "403": { description: Workspace access revoked }
        "404": { description: Execution absent in account and immutable workspace scope }
        "409": { description: Execution failed; never restarted }
  /tender-intelligence/requests/{requestId}:
    get:
      operationId: recoverTenderRequest
      summary: Recover an account-scoped Tender request without calling AI
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, pattern: "^[a-zA-Z0-9_-]{16,128}$" }
        - in: query
          name: workspaceId
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Stored authoritative result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderRequestState"
        "202":
          description: Still running; never automatically restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderRequestState"
        "409":
          description: Previous request failed or was interrupted; explicitly start a new request
        "401": { description: Authentication required }
        "403": { description: Workspace access revoked }
        "404": { description: Request absent in this account and workspace }
  /tender-intelligence/analyze:
    post:
      operationId: analyzeTender
      summary: Analyze Tender once per durable request identity
      description: Stable requestId replays status or stored result. Changed input or workspace returns 409. New analysis needs a new requestId. Legacy callers without requestId receive a server-generated identity but cannot recover a lost response by identity. Instances must share the existing SQLite database file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenderAnalysisInput"
      responses:
        "200":
          description: Saved analysis, also returned for a successful replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderRequestState"
        "202":
          description: Same request is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderRequestState"
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Workspace access revoked }
        "409": { description: "Changed input, previous failure, or another active request" }
        "429": { description: Application rate limit reached }
        "500": { description: Internal failure }
        "502": { description: Provider failure }
        "503": { description: Provider unavailable }
  /tender-intelligence/provider-setup:
    get:
      operationId: getTenderProviderSetupAccess
      summary: Check whether the current account can run the AI setup check
      responses:
        "200":
          description: Current administrator capability
          content:
            application/json:
              schema:
                type: object
                required: [canCheck]
                properties:
                  canCheck:
                    type: boolean
        "401":
          description: Authentication required
    post:
      operationId: checkTenderProviderSetup
      summary: Administrator-only minimal provider probe without project data
      description: Uses a small amount of provider quota. Limited to three checks per minute across administrators. No credentials or provider response text are returned.
      responses:
        "200":
          description: Safe point-in-time provider diagnostic
          content:
            application/json:
              schema:
                type: object
                required: [ready, code, checkedAt, message, action, retryable]
                properties:
                  ready:
                    type: boolean
                  code:
                    type: string
                    enum: [AI_PROVIDER_READY, AI_PROVIDER_NOT_CONFIGURED, AI_PROVIDER_AUTHENTICATION_FAILED, AI_PROVIDER_CREDITS_EXHAUSTED, AI_PROVIDER_RATE_LIMITED, AI_INVALID_MODEL_RESPONSE, AI_PROVIDER_REQUEST_REJECTED, AI_PROVIDER_UNAVAILABLE, AI_INTERNAL_ERROR]
                  checkedAt:
                    type: string
                    format: date-time
                  message:
                    type: string
                  action:
                    type: string
                  retryable:
                    type: boolean
        "401":
          description: Authentication required
        "403":
          description: Current account is not an administrator
        "429":
          description: Application diagnostic limit reached
  /tender-intelligence/provider-setup/history:
    get:
      operationId: getTenderProviderAudit
      summary: Administrator-only audit of the latest 50 provider setup checks
      description: Newest first, ordered by audit ID. Contains only internal account IDs, server timestamps and allowlisted outcome codes. Separate from Tender analyses.
      responses:
        "200":
          description: Latest 50 administrative checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenderProviderAuditHistory"
        "401":
          description: Authentication required
        "403":
          description: Current account is not an administrator
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /learn/progress:
    get:
      operationId: getLearnProgress
      tags: [learn]
      summary: Get personal learning progress
      responses:
        "200":
          description: Personal learning progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProgressList"
  /learn/progress/sync:
    post:
      operationId: mergeLearnProgress
      tags: [learn]
      summary: Merge device learning progress into the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningProgressSyncInput"
      responses:
        "200":
          description: Merged personal learning progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProgressList"
  /learn/progress/complete:
    post:
      operationId: completeLearnProgress
      tags: [learn]
      summary: Mark one lesson complete for the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningProgressInput"
      responses:
        "200":
          description: Saved personal learning progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProgressCompletion"
components:
  schemas:
    TenderProviderAuditEvent:
      type: object
      additionalProperties: false
      required: [id, accountId, checkedAt, code]
      properties:
        id: { type: integer, minimum: 1 }
        accountId: { type: integer, minimum: 1 }
        checkedAt: { type: string, format: date-time }
        code:
          type: string
          enum: [AI_PROVIDER_READY, AI_PROVIDER_NOT_CONFIGURED, AI_PROVIDER_AUTHENTICATION_FAILED, AI_PROVIDER_CREDITS_EXHAUSTED, AI_PROVIDER_RATE_LIMITED, AI_INVALID_MODEL_RESPONSE, AI_PROVIDER_REQUEST_REJECTED, AI_PROVIDER_UNAVAILABLE, AI_INTERNAL_ERROR, AI_SETUP_RATE_LIMITED]
    TenderProviderAuditHistory:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/TenderProviderAuditEvent"
    TenderAnalysisInput:
      type: object
      required: [projectName, documents]
      properties:
        requestId: { type: string, pattern: "^[a-zA-Z0-9_-]{16,128}$" }
        projectName: { type: string, minLength: 1, maxLength: 300 }
        tenderType: { type: string, maxLength: 200 }
        projectDetails: { type: string, maxLength: 8000 }
        workspaceId: { type: ["string", "null"], maxLength: 128 }
        retryOfId: { type: ["string", "null"], maxLength: 128 }
        checklistState:
          type: object
          additionalProperties:
            type: object
            required: [checked, notes]
            properties:
              checked: { type: boolean }
              notes: { type: string, maxLength: 2000 }
        documents:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/TenderDocumentInput"
    TenderDocumentInput:
      type: object
      required: [documentType, required, present, notes]
      properties:
        documentType: { type: string, minLength: 1, maxLength: 200 }
        required: { type: boolean }
        present: { type: boolean }
        notes: { type: string, maxLength: 2000 }
    TenderActiveRequest:
      type: object
      required: [activeRequest]
      properties:
        activeRequest:
          type: ["object", "null"]
          required: [executionId]
          properties:
            executionId: { type: string }
    TenderRequestState:
      type: object
      required: [status, executionId]
      properties:
        status: { type: string, enum: [running, succeeded, failed] }
        executionId: { type: string }
        resultRef: { type: ["string", "null"] }
        message: { type: string }
        result:
          type: object
          description: Authoritative saved Tender analysis including original input and scores
          additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LearningProgressInput:
      type: object
      required: [pathId, moduleId, lessonId]
      properties:
        pathId:
          type: string
          minLength: 1
          maxLength: 160
        moduleId:
          type: string
          minLength: 1
          maxLength: 160
        lessonId:
          type: string
          minLength: 1
          maxLength: 160
    LearningProgressSyncInput:
      type: object
      required: [progress]
      properties:
        progress:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/LearningProgressInput"
    LearningProgress:
      allOf:
        - $ref: "#/components/schemas/LearningProgressInput"
        - type: object
          required: [completedAt]
          properties:
            completedAt:
              type: string
              format: date-time
    LearningProgressList:
      type: object
      required: [progress]
      properties:
        progress:
          type: array
          items:
            $ref: "#/components/schemas/LearningProgress"
    LearningProgressCompletion:
      type: object
      required: [progress]
      properties:
        progress:
          $ref: "#/components/schemas/LearningProgress"

