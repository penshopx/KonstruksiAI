openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /tender-intelligence/provider-setup:
    get:
      operationId: getTenderProviderSetupAccess
      summary: Check whether the current account can run the AI setup check
      responses:
        "200":
          description: Current administrator capability
          content:
            application/json:
              schema:
                type: object
                required: [canCheck]
                properties:
                  canCheck:
                    type: boolean
        "401":
          description: Authentication required
    post:
      operationId: checkTenderProviderSetup
      summary: Administrator-only minimal provider probe without project data
      description: Uses a small amount of provider quota. Limited to three checks per minute across administrators. No credentials or provider response text are returned.
      responses:
        "200":
          description: Safe point-in-time provider diagnostic
          content:
            application/json:
              schema:
                type: object
                required: [ready, code, checkedAt, message, action, retryable]
                properties:
                  ready:
                    type: boolean
                  code:
                    type: string
                    enum: [AI_PROVIDER_READY, AI_PROVIDER_NOT_CONFIGURED, AI_PROVIDER_AUTHENTICATION_FAILED, AI_PROVIDER_CREDITS_EXHAUSTED, AI_PROVIDER_RATE_LIMITED, AI_INVALID_MODEL_RESPONSE, AI_PROVIDER_REQUEST_REJECTED, AI_PROVIDER_UNAVAILABLE, AI_INTERNAL_ERROR]
                  checkedAt:
                    type: string
                    format: date-time
                  message:
                    type: string
                  action:
                    type: string
                  retryable:
                    type: boolean
        "401":
          description: Authentication required
        "403":
          description: Current account is not an administrator
        "429":
          description: Application diagnostic limit reached
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /learn/progress:
    get:
      operationId: getLearnProgress
      tags: [learn]
      summary: Get personal learning progress
      responses:
        "200":
          description: Personal learning progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProgressList"
  /learn/progress/sync:
    post:
      operationId: mergeLearnProgress
      tags: [learn]
      summary: Merge device learning progress into the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningProgressSyncInput"
      responses:
        "200":
          description: Merged personal learning progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProgressList"
  /learn/progress/complete:
    post:
      operationId: completeLearnProgress
      tags: [learn]
      summary: Mark one lesson complete for the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningProgressInput"
      responses:
        "200":
          description: Saved personal learning progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProgressCompletion"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LearningProgressInput:
      type: object
      required: [pathId, moduleId, lessonId]
      properties:
        pathId:
          type: string
          minLength: 1
          maxLength: 160
        moduleId:
          type: string
          minLength: 1
          maxLength: 160
        lessonId:
          type: string
          minLength: 1
          maxLength: 160
    LearningProgressSyncInput:
      type: object
      required: [progress]
      properties:
        progress:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/LearningProgressInput"
    LearningProgress:
      allOf:
        - $ref: "#/components/schemas/LearningProgressInput"
        - type: object
          required: [completedAt]
          properties:
            completedAt:
              type: string
              format: date-time
    LearningProgressList:
      type: object
      required: [progress]
      properties:
        progress:
          type: array
          items:
            $ref: "#/components/schemas/LearningProgress"
    LearningProgressCompletion:
      type: object
      required: [progress]
      properties:
        progress:
          $ref: "#/components/schemas/LearningProgress"

