kind = "video"
previewPath = "/konstruksi-promo/"
title = "KonstruksiAI Promo Video"
version = "1.0.0"
id = "artifacts/konstruksi-promo"
router = "path"

[[services]]
name = "web"
paths = [ "/konstruksi-promo/" ]
localPort = 21121

[services.development]
run = "pnpm --filter @workspace/konstruksi-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/konstruksi-promo", "run", "build" ]
serve = "static"
publicDir = "artifacts/konstruksi-promo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21121"
BASE_PATH = "/konstruksi-promo/"
